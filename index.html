<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hexaverde</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <header id="hud">
    <div class="stat money" id="hud-money" title="Treasury (income − expenses per day)"><span>💰</span><b id="money">0</b><small id="net"></small></div>
    <div class="stat" title="Citizens / jobs"><span>👥</span><b id="pop">0</b><small id="jobs"></small></div>
    <div class="stat eco" title="Eco score"><span>🌿</span><b id="eco">100</b></div>
    <div class="demand" title="Demand: Residential / Commercial / Industry">
      <i id="dR" class="r"></i><i id="dC" class="c"></i><i id="dI" class="i"></i>
    </div>
    <div class="stat day"><span>📅</span><b id="day">1</b></div>
    <div class="speed" id="speed">
      <button data-speed="0" title="Pause">⏸</button>
      <button data-speed="1" title="Normal">▶</button>
      <button data-speed="2" title="Fast">⏩</button>
      <button data-speed="4" title="Fastest">⏭</button>
    </div>
    <button id="btn-goal" class="hud-btn" title="Goals">🎯</button>
    <button id="btn-menu" class="hud-btn" title="Menu">☰</button>
  </header>
  <div id="goalbar"></div>

  <nav id="buildmenu"></nav>
  <div id="flyout" class="panel hidden"></div>

  <aside id="inspector" class="panel collapsed">
    <button id="insp-close" class="close" title="Close">✕</button>
    <div id="insp-body"></div>
  </aside>

  <div id="mapctl">
    <button data-ctl="rotl" title="Rotate left (Q)">⟲</button>
    <button data-ctl="rotr" title="Rotate right (E)">⟳</button>
    <button data-ctl="zin" title="Zoom in">＋</button>
    <button data-ctl="zout" title="Zoom out">－</button>
    <button data-ctl="eco" title="Pollution overlay">☁️</button>
    <button data-ctl="home" title="Back to start">⌂</button>
  </div>

  <div id="toasts"></div>
  <div id="modal" class="hidden"><div class="panel modal-card" id="modal-card"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
